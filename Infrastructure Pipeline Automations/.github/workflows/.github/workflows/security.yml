name: "Continuous Delivery Security Engine Schedule"

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  id-token: "write"
  contents: "read"

jobs:
  execute_scan:
    name: "Run AWS Security Auditor Analysis Suite"
    runs-on: "ubuntu-latest"
    
    steps:
      - name: "Checkout Codebase Source Structure"
        uses: "actions/checkout@v4"

      - name: "Initialize Base Python Runtime Layer"
        uses: "actions/setup-python@v5"
        with:
          python-version: "3.11"
          cache: "pip"

      - name: "Install System Core Requirements Mapping"
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: "Configure AWS Production Identity Assumed Credentials via OIDC"
        uses: "aws-actions/configure-aws-credentials@v4"
        with:
          role-to-assume: "arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/GitHubActionsSecurityAuditorRole"
          aws-region: "us-east-1"

      - name: "Trigger Core Scanner Execution Path"
        run: |
          export PYTHONPATH="${PYTHONPATH}:$(pwd)/src"
          python src/main.py

      - name: "Persist Analytical Output Report Elements to Execution Context Artifacts"
        uses: "actions/upload-artifact@v4"
        with:
          name: "AWS-Security-Audit-Reports"
          path: "reports/"
          retention-days: 14