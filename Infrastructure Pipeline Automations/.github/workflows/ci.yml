name: "Continuous Integration"

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test_and_lint:
    name: "Code Execution Linting Verification Checks"
    runs-on: "ubuntu-latest"
    
    steps:
      - name: "Checkout Codebase Source Structure"
        uses: "actions/checkout@v4"

      - name: "Initialize Python Functional Environments"
        uses: "actions/setup-python@v5"
        with:
          python-version: "3.11"
          cache: "pip"

      - name: "Install Engineering Dependencies"
        run: |
          python -m pip install --upgrade pip
          pip install flake8 mypy -r requirements.txt

      - name: "Enforce Coding Lint Standard Matrix Compliance"
        run: |
          # stop the build if there are Python syntax errors or undefined names
          flake8 src/ --count --select=E9,F63,F7,F82 --show-source --statistics
          # exit-zero treats all errors as warnings.
          flake8 src/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: "Perform Static Typing Ingress Auditing Checks via Mypy"
        run: |
          mypy src/ --ignore-missing-imports